<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Chat · rooms</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><circle cx='16' cy='16' r='6' fill='%23fff'/></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border: #e5e5e5;
      --accent: #005a3c;
      --radius: 8px;
      --transition: 0.2s ease;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      background: var(--bg);
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ────────────────────────────────────────────────────────────── */
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg);
    }
    .brand {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-right input {
      border-radius: 16px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      width: 130px;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
    }
    .header-right input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all var(--transition);
    }
    .btn:hover {
      background: #00432d;
    }
    .status {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 16px;
      background: #e8f4e8;
      color: #0d6b2c;
      font-weight: 500;
    }

    /* ── CONTENT WRAPPER ──────────────────────────────────────────────────── */
    .content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── DIRECTORY SCREEN ────────────────────────────────────────────────── */
    #directory {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      min-height: 0;
      height: 100%;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .chip {
      padding: 7px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }
    .chip:hover {
      border-color: var(--accent);
      background: var(--bg-secondary);
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      flex: 1;
      overflow: auto;
      align-content: start;
    }
    .room-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 160px;
    }
    .room-card:hover {
      border-color: var(--accent);
      background: var(--bg-secondary);
    }
    .room-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .room-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      flex: 1;
    }
    .room-lang {
      background: var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .room-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      flex: 1;
    }
    .room-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .room-members {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .join-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .join-btn:hover {
      background: #00432d;
    }
    .join-btn.full {
      background: #e5e5e5;
      color: var(--text-secondary);
      cursor: default;
    }

    /* ── ROOM VIEW (grid layout with sidebar) ───────────────────────────── */
    #room-view {
      display: none;
      height: 100%;
      background: var(--bg);
    }
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: 1fr;
      height: 100%;
      gap: 0;
    }
    @media (max-width: 920px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none !important;
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        border-left: 1px solid var(--border);
        background: var(--bg);
        z-index: 999;
        box-shadow: -4px 0 12px rgba(0,0,0,0.05);
      }
      .sidebar.open {
        display: flex !important;
      }
    }

    /* main area (participants) */
    .main-area {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .participants-area {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      background: var(--bg);
    }
    .participant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 900px;
      align-content: center;
    }
    .participant-card {
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      padding: 6px;
      min-height: 120px;
      transition: all var(--transition);
    }
    .participant-card:hover {
      border-color: var(--accent);
      background: #fafafa;
    }
    .participant-avatar {
      font-size: 26px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .participant-name {
      font-weight: 500;
      font-size: 13px;
      color: var(--text-primary);
      text-align: center;
    }
    .participant-status {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .status-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #52c41a;
    }

    .bottom-info {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      text-align: center;
      flex-shrink: 0;
    }

    /* sidebar */
    .sidebar {
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar.closed { display: none !important; }
    .sidebar-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .chat-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 8px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    .chat-message {
      font-size: 13px;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.4;
      word-wrap: break-word;
    }
    .chat-message.own {
      background: var(--accent);
      color: white;
      font-weight: 500;
      align-self: flex-end;
      max-width: 90%;
    }
    .chat-message strong {
      color: var(--text-secondary);
      display: block;
      font-size: 10px;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .chat-form {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .chat-form input {
      flex: 1;
      border-radius: 18px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .chat-form input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    .chat-form button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 0 14px;
      font-size: 16px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .chat-form button:hover {
      background: #00432d;
    }

    .sidebar-icons {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .sidebar-icon-btn:hover {
      border-color: var(--text-secondary);
      background: var(--bg-secondary);
    }

    /* topbar inside room view */
    .room-topbar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 12px;
      height: 48px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 8px 6px 4px;
      border-radius: 6px;
      transition: all var(--transition);
    }
    .back-link:hover {
      background: var(--bg-secondary);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--text-secondary);
    }
    .icon-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .icon-btn.danger:hover {
      background: #fee;
      border-color: #f88;
    }
    #chat-btn {
      display: none;
    }
    @media (max-width: 920px) {
      #chat-btn {
        display: flex !important;
      }
    }

    /* ── MODALS ───────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
      padding: 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .modal h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .modal .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .modal-field {
      margin-bottom: 12px;
    }
    .modal-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .modal-field input,
    .modal-field textarea {
      width: 100%;
      border-radius: 8px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      resize: vertical;
    }
    .modal-field input:focus,
    .modal-field textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .modal-actions .cancel {
      background: var(--bg);
      color: var(--text-primary);
    }
    .modal-actions .cancel:hover {
      background: var(--bg-secondary);
    }
    .modal-actions .save {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .modal-actions .save:hover {
      background: #00432d;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">Voice Chat</div>
  <div class="header-right">
    <input id="username" type="text" value="Guest" placeholder="Your name">
    <button class="btn" id="create-btn">+ Create</button>
    <div class="status">● Online</div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- DIRECTORY SCREEN -->
  <div id="directory">
    <div class="filters" id="filters"></div>
    <div class="rooms-grid" id="rooms-grid"></div>
  </div>

  <!-- ROOM VIEW (with grid + sidebar) -->
  <div id="room-view">
    <div class="app-grid">
      <!-- left: main area -->
      <div class="main-area">
        <!-- topbar -->
        <div class="room-topbar">
          <div class="topbar-left">
            <button class="back-link" id="back-btn" title="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
          </div>
          <div class="topbar-right">
            <button class="icon-btn active" id="mute-btn" title="Mute">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="icon-btn active" id="speaker-btn" title="Speaker">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a7 7 0 0 1 0 9.9M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <button class="icon-btn" id="chat-btn" title="Chat">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="icon-btn danger" id="leave-btn" title="Leave">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/><line x1="9" y1="12" x2="9" y2="5"/></svg>
            </button>
          </div>
        </div>

        <!-- participants -->
        <div class="participants-area">
          <div class="participant-grid" id="participants"></div>
        </div>
        <div class="bottom-info" id="room-info">Loading...</div>
      </div>

      <!-- right: sidebar -->
      <div class="sidebar" id="room-sidebar">
        <div class="sidebar-chat">
          <div class="sidebar-title">Chat</div>
          <div class="chat-box">
            <div class="chat-messages" id="messages"></div>
            <form class="chat-form" id="chat-form">
              <input type="text" id="message-input" placeholder="Message..." maxlength="150">
              <button type="submit" title="Send">→</button>
            </form>
          </div>
        </div>
        <div class="sidebar-icons">
          <button class="sidebar-icon-btn" id="close-chat-btn" title="Close chat" aria-label="Close chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m3.08 3.08l4.24 4.24M1 12h6m6 0h6m-4.22-7.78l-4.24 4.24m-3.08 3.08l-4.24 4.24M4.22 19.78l4.24-4.24m3.08-3.08l4.24-4.24"/></svg>
          </button>
          <button class="sidebar-icon-btn" id="invite-btn" title="Invite">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CREATE ROOM MODAL -->
<div id="create-modal" class="modal-overlay">
  <div class="modal">
    <h2>Create Room</h2>
    <div class="subtitle">Start a new voice chat room</div>
    <form id="create-form">
      <div class="modal-field">
        <label>Name</label>
        <input type="text" id="new-room-name" placeholder="Room name" value="My Room">
      </div>
      <div class="modal-field">
        <label>Language</label>
        <input type="text" id="new-room-lang" placeholder="Language" value="English">
      </div>
      <div class="modal-field">
        <label>Description</label>
        <textarea id="new-room-desc" placeholder="What's this room about?">Practice together</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="create-cancel">Cancel</button>
        <button type="submit" class="save">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- LEAVE CONFIRMATION -->
<div id="leave-modal" class="modal-overlay">
  <div class="modal">
    <h2>Leave Room?</h2>
    <div class="subtitle">You'll be disconnected from this room</div>
    <div class="modal-actions">
      <button class="cancel" id="stay-btn">Cancel</button>
      <button class="save" id="confirm-leave-btn">Leave</button>
    </div>
  </div>
</div>

<script>
  // ── DATA ────────────────────────────────────────────────────────────────
  let rooms = [
    { id: '1', name: 'English Lounge', lang: 'English', desc: 'Casual English practice', count: 5, limit: 10 },
    { id: '2', name: 'Spanish Cafe', lang: 'Spanish', desc: 'Spanish conversation', count: 3, limit: 8 },
    { id: '3', name: 'French Salon', lang: 'French', desc: 'Advanced level', count: 2, limit: 6 },
    { id: '4', name: 'German Corner', lang: 'German', desc: 'Beginner & intermediate', count: 1, limit: 6 },
    { id: '5', name: 'Mandarin Hub', lang: 'Mandarin', desc: 'Tones & conversation', count: 4, limit: 10 },
  ];

  let username = 'Guest';
  let activeLang = 'all';
  let currentRoom = null;
  let roomMessages = [];
  let participants = [];
  let isMuted = false;
  let isSpeaker = true;

  // ── DOM ──────────────────────────────────────────────────────────────────
  const directory = document.getElementById('directory');
  const roomsGrid = document.getElementById('rooms-grid');
  const filtersDiv = document.getElementById('filters');
  const usernameInput = document.getElementById('username');
  const createBtn = document.getElementById('create-btn');
  const createModal = document.getElementById('create-modal');
  const createForm = document.getElementById('create-form');

  const roomView = document.getElementById('room-view');
  const participantsDiv = document.getElementById('participants');
  const messagesDiv = document.getElementById('messages');
  const chatForm = document.getElementById('chat-form');
  const messageInput = document.getElementById('message-input');
  const roomInfo = document.getElementById('room-info');
  const sidebar = document.getElementById('room-sidebar');
  const chatBtn = document.getElementById('chat-btn');
  const closeChatBtn = document.getElementById('close-chat-btn');
  const backBtn = document.getElementById('back-btn');
  const leaveBtn = document.getElementById('leave-btn');
  const leaveModal = document.getElementById('leave-modal');
  const stayBtn = document.getElementById('stay-btn');
  const confirmLeaveBtn = document.getElementById('confirm-leave-btn');
  const inviteBtn = document.getElementById('invite-btn');
  const muteBtn = document.getElementById('mute-btn');
  const speakerBtn = document.getElementById('speaker-btn');

  // ── RENDER FILTERS ──────────────────────────────────────────────────────
  function renderFilters() {
    const langs = ['All', 'English', 'Spanish', 'French', 'German', 'Mandarin'];
    filtersDiv.innerHTML = langs.map(lang => {
      const key = lang.toLowerCase();
      const isActive = (lang === 'All' && activeLang === 'all') || activeLang === key;
      return `<button class="chip ${isActive ? 'active' : ''}" data-lang="${key}">${lang}</button>`;
    }).join('');
    filtersDiv.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeLang = btn.dataset.lang;
        renderFilters();
        renderRooms();
      });
    });
  }

  // ── RENDER ROOMS ────────────────────────────────────────────────────────
  function renderRooms() {
    let filtered = activeLang === 'all' ? rooms : rooms.filter(r => r.lang.toLowerCase() === activeLang);
    roomsGrid.innerHTML = filtered.map(room => {
      const full = room.count >= room.limit;
      return `
        <div class="room-card" data-id="${room.id}">
          <div class="room-top">
            <div class="room-name">${room.name}</div>
            <div class="room-lang">${room.lang}</div>
          </div>
          <div class="room-desc">${room.desc}</div>
          <div class="room-bottom">
            <div class="room-members">👥 ${room.count} member${room.count !== 1 ? 's' : ''}</div>
            <button class="join-btn ${full ? 'full' : ''}" data-id="${room.id}">${full ? 'Full' : 'Join'}</button>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.join-btn').forEach(btn => {
      if (!btn.classList.contains('full')) {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const room = rooms.find(r => r.id === btn.dataset.id);
          if (room) enterRoom(room);
        });
      }
    });
    document.querySelectorAll('.room-card').forEach(card => {
      card.addEventListener('click', () => {
        const room = rooms.find(r => r.id === card.dataset.id);
        if (room && room.count < room.limit) enterRoom(room);
      });
    });
  }

  // ── ENTER ROOM ──────────────────────────────────────────────────────────
  function enterRoom(room) {
    currentRoom = room;
    room.count = Math.min(room.count + 1, room.limit);
    // init participants
    participants = [
      { name: 'You', avatar: '🧑', status: 'speaking' },
      { name: 'Maria', avatar: '👩', status: 'listening' },
      { name: 'Carlos', avatar: '👨', status: 'listening' },
      { name: 'Elena', avatar: '👱', status: 'listening' },
      { name: 'John', avatar: '🧔', status: 'listening' },
    ];
    roomMessages = [
      { sender: 'System', text: `Welcome to ${room.name}!`, own: false },
      { sender: 'Maria', text: 'Hello everyone!', own: false },
      { sender: 'You', text: 'Hi!', own: true },
    ];

    directory.style.display = 'none';
    roomView.style.display = 'block';
    updateRoomInfo();
    renderParticipants();
    renderMessages();
  }

  // ── RENDER PARTICIPANTS ────────────────────────────────────────────────
  function renderParticipants() {
    participantsDiv.innerHTML = participants.map(p => `
      <div class="participant-card">
        <div class="participant-avatar">${p.avatar}</div>
        <div class="participant-name">${p.name}</div>
        <div class="participant-status"><span class="status-dot"></span> ${p.status}</div>
      </div>
    `).join('');
  }

  // ── RENDER MESSAGES ──────────────────────────────────────────────────────
  function renderMessages() {
    messagesDiv.innerHTML = roomMessages.map(m => `
      <div class="chat-message ${m.own ? 'own' : ''}">
        ${!m.own ? `<strong>${m.sender}</strong>` : ''}
        ${m.text}
      </div>
    `).join('');
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // ── UPDATE ROOM INFO ─────────────────────────────────────────────────────
  function updateRoomInfo() {
    if (currentRoom) {
      roomInfo.textContent = `${currentRoom.name} • 🌐 ${currentRoom.lang} • ${currentRoom.count} members`;
    }
  }

  // ── LEAVE ROOM ─────────────────────────────────────────────────────────
  function leaveRoom() {
    if (currentRoom) {
      currentRoom.count = Math.max(currentRoom.count - 1, 0);
      currentRoom = null;
    }
    roomMessages = [];
    participants = [];
    directory.style.display = 'flex';
    roomView.style.display = 'none';
    renderRooms();
    leaveModal.classList.remove('open');
    sidebar.classList.remove('open');
  }

  // ── EVENTS ──────────────────────────────────────────────────────────────
  usernameInput.addEventListener('change', () => {
    username = usernameInput.value.trim() || 'Guest';
  });

  createBtn.addEventListener('click', () => createModal.classList.add('open'));
  document.getElementById('create-cancel').addEventListener('click', () => createModal.classList.remove('open'));
  createForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('new-room-name').value.trim() || 'New Room';
    const lang = document.getElementById('new-room-lang').value.trim() || 'English';
    const desc = document.getElementById('new-room-desc').value.trim() || 'Let\'s practice!';
    const newRoom = { id: 'r' + Date.now(), name, lang, desc, count: 1, limit: 10 };
    rooms.push(newRoom);
    createModal.classList.remove('open');
    createForm.reset();
    renderRooms();
    enterRoom(newRoom);
  });
  createModal.addEventListener('click', e => { if (e.target === createModal) createModal.classList.remove('open'); });

  // back
  backBtn.addEventListener('click', () => {
    if (window.innerWidth <= 920 && sidebar.classList.contains('open')) {
      sidebar.classList.remove('open');
    } else {
      leaveRoom();
    }
  });

  // leave
  leaveBtn.addEventListener('click', () => leaveModal.classList.add('open'));
  stayBtn.addEventListener('click', () => leaveModal.classList.remove('open'));
  confirmLeaveBtn.addEventListener('click', leaveRoom);

  // invite
  inviteBtn.addEventListener('click', () => alert('Share: ' + window.location.href));

  // mute / speaker
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle('active', !isMuted);
  });
  speakerBtn.addEventListener('click', () => {
    isSpeaker = !isSpeaker;
    speakerBtn.classList.toggle('active', isSpeaker);
  });

  // chat toggle (mobile)
  chatBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.remove('closed');
    sidebar.classList.toggle('open');
      closeChatBtn.addEventListener('click', () => {
        sidebar.classList.remove('open');
        sidebar.classList.add('closed');
        chatBtn.classList.remove('active');
      });
    chatBtn.classList.toggle('active', sidebar.classList.contains('open'));
  });
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 920) {
      if (!sidebar.contains(e.target) && !chatBtn.contains(e.target)) {
        sidebar.classList.remove('open');
        chatBtn.classList.remove('active');
      }
    }
  });

  // chat send
  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !currentRoom) return;
    roomMessages.push({ sender: username, text, own: true });
    messageInput.value = '';
    renderMessages();
    setTimeout(() => {
      const names = ['Maria', 'Carlos', 'Elena', 'John'];
      const replies = ['Great!', 'I agree!', 'Exactly!', 'Nice!', '100%'];
      roomMessages.push({
        sender: names[Math.floor(Math.random() * names.length)],
        text: replies[Math.floor(Math.random() * replies.length)],
        own: false
      });
      renderMessages();
    }, 600);
  });

  // rotate speaker
  function rotateSpeaker() {
    if (!participants.length) return;
    participants.forEach(p => p.status = 'listening');
    const idx = Math.floor(Math.random() * participants.length);
    participants[idx].status = 'speaking';
    renderParticipants();
  }

  // ── INIT ────────────────────────────────────────────────────────────────
  renderFilters();
  renderRooms();
  setInterval(rotateSpeaker, 4000);
</script>
</body>
</html>
